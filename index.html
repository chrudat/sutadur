<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Vorerst leer</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --accent: #3a3a3c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --text: #f2f2f7;
        --muted: #8e8e93;
        --accent: #d1d1d6;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 440px;
      text-align: center;
    }

    .illustration {
      width: 96px;
      height: 96px;
      margin: 0 auto 2rem;
      color: var(--accent);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* Sanfte Wellenbewegung */
    @keyframes drift {
      0%, 100% { transform: translateX(-2px); opacity: 0.4; }
      50% { transform: translateX(2px); opacity: 0.9; }
    }

    .wave-offset {
      animation: drift 5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <main>
    <!-- Minimalistische SVG-Grafik: Ein leerer Kreis mit einer offenen Unterbrechung und einer ruhigen Welle -->
    <svg class="illustration" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Offener Kreis (symbolisiert einen unvollständigen Zyklus / offenes Ende) -->
      <path d="M72 48C72 61.2548 61.2548 72 48 72C34.7452 72 24 61.2548 24 48C24 34.7452 34.7452 24 48 24C55.4 24 62.02 27.35 66.42 32.62" 
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Minimalistische Welle im Inneren -->
      <path class="wave-offset" d="M36 49C39 45 42 45 45 49C48 53 51 53 54 49C57 45 60 45 62 47.5" 
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <h1>Gerüchteweise passiert hier noch was.</h1>
    <p>Vielleicht demnächst. Vielleicht auch nicht.</p>
  </main>
</body>
</html>
